name: DSI Global Remote Scraper V3

on:
  schedule:
    - cron: '0 6 * * *' # 12 PM BST is 6 AM UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        run: python dsi_scraper_v3.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsi-hiring-signals-${{ github.run_id }}
          path: "*.csv"
          retention-days: 14
